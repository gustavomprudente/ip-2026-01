<!DOCTYPE html> <!-- Declaração do tipo de documento como HTML5 -->
<html lang="pt-BR"> <!-- Início do documento HTML definindo o idioma como Português do Brasil -->
<head> <!-- Seção de cabeçalho contendo metadados e links externos -->
    <meta charset="UTF-8"> <!-- Define a codificação de caracteres como UTF-8 para suporte a acentos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Define viewport para garantir responsividade em dispositivos móveis -->
    <title>Atualizar Paciente — Hospital Teste</title> <!-- Título da página exibido na aba do navegador -->
    <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- Pré-conexão ao domínio de fontes do Google -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- Pré-conexão de segurança cruzada para fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"> <!-- Importação da fonte moderna Inter -->
    <link rel="stylesheet" href="/static/styles/updatePatient.style.css"> <!-- Link para a folha de estilo específica da página de atualização -->
</head> <!-- Fim do cabeçalho da página -->
<body> <!-- Início do corpo visual da página -->
    <div class="form-container"> <!-- Div que centraliza e contém todo o formulário de atualização -->
        <a href="/" class="back-link">← Voltar ao Início</a> <!-- Link discreto de retorno à página principal do sistema -->
        
        <h2>✏️ Atualizar Dados do Paciente</h2> <!-- Título do formulário indicando a operação de atualização -->
        <p class="form-subtitle">Informe o CPF para localizar o registro e preencha os novos dados.</p> <!-- Subtítulo do formulário -->

        <div id="alert-box" class="alert hidden"> <!-- Caixa de alertas ocultada por padrão para exibir feedbacks de sucesso ou erro -->
            <span id="alert-message"></span> <!-- Elemento span que receberá o texto da mensagem dinâmica -->
        </div> <!-- Fim da caixa de alertas -->

        <form action="/atualizar" method="POST"> <!-- Elemento de formulário enviando dados por método POST para rota /atualizar -->
            <div class="form-group"> <!-- Agrupador para rótulo e campo de digitação individual -->
                <label for="cpf">CPF do Paciente * (apenas números)</label> <!-- Rótulo indicando obrigatoriedade e padrão do CPF -->
                <input type="text" id="cpf" name="cpf" placeholder="Ex: 12345678901" required pattern="\d{11}" title="Digite exatamente 11 números sem pontos ou traços."> <!-- Campo de texto de 11 dígitos numéricos para identificar o paciente -->
            </div> <!-- Fim do agrupador de campo -->

            <div class="form-group"> <!-- Agrupador para rótulo e campo de digitação individual -->
                <label for="full_name">Novo Nome Completo *</label> <!-- Rótulo indicando obrigatoriedade do novo nome -->
                <input type="text" id="full_name" name="full_name" placeholder="Ex: Gustavo Prudente Atualizado" required maxlength="150"> <!-- Campo de texto para alteração do nome limitado a 150 caracteres -->
            </div> <!-- Fim do agrupador de campo -->

            <div class="form-group"> <!-- Agrupador para rótulo e campo de digitação individual -->
                <label for="phone">Novo Telefone</label> <!-- Rótulo opcional de alteração de telefone de contato -->
                <input type="tel" id="phone" name="phone" placeholder="Ex: (62) 99999-8888" maxlength="20"> <!-- Campo de telefone limitado a 20 caracteres -->
            </div> <!-- Fim do agrupador de campo -->

            <div class="form-group"> <!-- Agrupador para rótulo e campo de digitação individual -->
                <label for="diagnosis">Novo Diagnóstico</label> <!-- Rótulo opcional de alteração do diagnóstico clínico -->
                <textarea id="diagnosis" name="diagnosis" rows="4" placeholder="Atualize os sintomas ou novo diagnóstico..."></textarea> <!-- Área de texto multi-linha para nova descrição de histórico médico -->
            </div> <!-- Fim do agrupador de campo -->

            <button type="submit" class="btn-submit">Atualizar Ficha</button> <!-- Botão de submissão do formulário para salvar alterações no banco -->
        </form> <!-- Fim do formulário -->
    </div> <!-- Fim do container do formulário -->

    <script> <!-- Início da tag de script javascript para tratar feedback dinâmico -->
        window.addEventListener('DOMContentLoaded', () => { // Aguarda todo o carregamento do DOM da página estar completo
            const urlParams = new URLSearchParams(window.location.search); // Cria instância para pesquisar os parâmetros na URL da página
            const status = urlParams.get('status'); // Obtém o parâmetro status da URL
            const msg = urlParams.get('msg'); // Obtém o parâmetro de mensagem da URL

            if (status && msg) { // Verifica se ambos os parâmetros foram enviados via URL
                const alertBox = document.getElementById('alert-box'); // Captura o elemento HTML da caixa de alertas pelo ID
                const alertMessage = document.getElementById('alert-message'); // Captura o span que exibirá o texto do alerta

                alertMessage.textContent = decodeURIComponent(msg); // Decodifica e define a mensagem no conteúdo de texto do span
                alertBox.classList.remove('hidden'); // Remove a classe que oculta a caixa de alertas da interface
                alertBox.classList.add(status); // Adiciona a classe correspondente ao status (success ou error) para colorir o bloco
            } // Fecha o bloco condicional de parâmetros de mensagem
        }); // Fecha o ouvinte de carregamento de DOM
    </script> <!-- Fim do bloco JavaScript inline -->
</body> <!-- Fim do corpo visual -->
</html> <!-- Fim do documento HTML -->
